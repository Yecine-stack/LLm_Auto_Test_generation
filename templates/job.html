<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Generating tests…</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Generating tests</h1>

    <p><a href="{{ url_for('index') }}">← back</a></p>

    <p id="line" style="font-weight:600; font-size:1.1rem; margin-bottom:0.5rem;">Starting…</p>
    <progress id="bar" value="0" max="1" style="width:100%; height:8px; border-radius:4px; margin-bottom:1.5rem;"></progress>

    <div id="result"></div>
</div>

<script>
const jobId = {{ job_id|tojson }};

async function poll() {
    const response = await fetch(`/job/${jobId}/status`);
    const data = await response.json();

    document.getElementById("bar").max = data.total || 1;
    document.getElementById("bar").value = data.done;
    document.getElementById("line").textContent =
        `${data.done}/${data.total} — ${data.last_story || ""} (${data.status})`;

    if (data.status === "finished") {
        document.getElementById("result").innerHTML =
            `<div class="ok">Done: ${data.successful} succeeded, ${data.failed_count} failed.</div>` +
            (data.zip_url ? `<p><a href="${data.zip_url}">Download generated tests (.zip)</a></p>` : "");
        return;
    }

    if (data.status === "error") {
        document.getElementById("result").innerHTML =
            `<div class="error">Generation failed: ${data.error}</div>`;
        return;
    }

    setTimeout(poll, 1500);
}

poll();
</script>

</body>
</html>
